services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: go_testing_workshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_testing_workshop"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - testing-workshop-postgres:/var/lib/postgresql/data

volumes:
  testing-workshop-postgres:
